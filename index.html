<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Reta · Pádel</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Retas, marcadores y ranking del pádel en Tepic.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="La Reta">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}

/* Layout: app de una columna para celular; banda azul de cancha arriba, barra de pestañas abajo, tarjetas tipo marcador */
:root{
  --bg:#050607; --surface:#101315; --ink:#f2f5ec; --muted:#8c958b; --line:#242a2c;
  --court:#d4ff1f; --court-2:#bfea00; --on-court:#0a0d00; --ball:#d4ff1f; --ball-ink:#0a0d00; --head:#000000;
  --good:#3fe486; --bad:#ff5b4a; --soft:#1a1f21; --glow:0 0 12px rgba(212,255,31,.55);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--ink);border-bottom:2px solid var(--ball);box-shadow:0 2px 18px rgba(212,255,31,.25)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.03em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px;color:var(--ball);text-shadow:var(--glow)}

.top .sub{font-size:13px;opacity:.85}
main{padding-block:18px 200px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h1{color:var(--ink);font-size:30px;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--on-court);box-shadow:var(--glow)}
.btn.primary:hover{background:var(--court-2)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);box-shadow:var(--glow)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #ffffff;outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:460px){.grid3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{flex:1;text-align:center;padding:10px 6px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--court);color:var(--on-court)}
.seg label:has(input:focus-visible){outline:3px solid var(--ball);outline-offset:-3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;white-space:nowrap}
.chip.ball{background:var(--ball);color:var(--ball-ink)}
.chip.court{background:var(--court);color:var(--on-court)}
.chip.done{background:transparent;border:1px solid var(--line);color:var(--muted)}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.card:hover{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball),var(--glow)}
.card .when{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:10px}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .who{min-width:0}
.alias{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase}
.tel{user-select:all;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--court)}
.rules{margin:0;padding-left:18px}
.rules li{margin:2px 0}
/* marcador */
.ronda-h{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.match .ct{background:var(--court);color:var(--on-court);font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:5px 12px;display:flex;justify-content:space-between}
.side{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 12px}
.side + .side{border-top:1px dashed var(--line)}
.side .names{font-weight:600;min-width:0;overflow-wrap:anywhere}
.side.win .names::after{content:" ●";color:var(--good)}
.score{width:64px;height:48px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.score:read-only{border-color:transparent;background:transparent}
.warn{color:var(--bad);font-size:12px;padding:0 12px 8px}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
/* tablas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th:first-child,td:first-child{text-align:center;width:36px}
tr.first td{background:rgba(212,255,31,.14)}
tr.first .pos{color:var(--ball);text-shadow:var(--glow)}
.pos{font-family:var(--f-display);font-weight:800;font-size:18px}
.elo{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ball)}
.rk td.nm{background:linear-gradient(90deg,rgba(255,196,40,calc(.06 + var(--g)*.62)) 0%,rgba(255,170,20,calc(var(--g)*.25)) 60%,rgba(255,196,40,0) 100%);border-left:3px solid rgba(255,200,60,calc(.15 + var(--g)*.85))}
.rk td.nm b{color:color-mix(in srgb,#ffd45a calc(var(--g)*100%),var(--ink))}
.rk tr.top td.nm b{text-shadow:0 0 10px rgba(255,200,60,.6)}
.rk .pos.m1{color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.7)}.rk .pos.m2{color:#d9dde3}.rk .pos.m3{color:#e0904f}
.up{color:var(--good)} .down{color:var(--bad)}
.counter{display:flex;align-items:center;gap:6px}
.counter b{min-width:28px;text-align:center;font-family:var(--f-display);font-size:22px}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px}
.pair .n{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ball)}
.banner{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;text-transform:uppercase;margin-bottom:4px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--head);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.q{appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ball);background:transparent;color:var(--ball);font:800 13px/1 var(--f-body);display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;margin-left:6px;padding:0;flex:none}
.q.on{background:var(--ball);color:var(--ball-ink)}
.lbl{display:flex;align-items:center;gap:0}
.ayuda{border-left:3px solid var(--ball);background:rgba(212,255,31,.07);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45}
.ayuda b{color:var(--ball)}
.precio-tbl{width:100%;border-collapse:collapse}
.precio-tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:normal}
.precio-tbl td:first-child{width:auto;text-align:left}
.precio-tbl td:last-child{width:96px;text-align:right;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ball)}
.precio-tbl tr:last-child td{border-bottom:0}
.franja{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.promo{position:relative;border-radius:12px;padding:14px 16px;background:linear-gradient(110deg,rgba(212,255,31,.16),rgba(212,255,31,.02));border:1px solid rgba(212,255,31,.55)}
.promo .t{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--ball);padding-right:60px}
.promo .tag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ball);color:var(--ball-ink);border-radius:999px;padding:3px 9px}
.slot .p{display:block;font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
.slot.promo2{border-color:#ffd45a;color:#ffd45a}
.court-c .tags{position:absolute;left:0;right:0;top:27px;text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#cfe7ff}
.court-c.con-tags{padding-top:48px}
.court-c.off{filter:grayscale(.85);opacity:.7}
.court-c .offnote{position:relative;text-align:center;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:6px;margin-bottom:8px;font-size:12px}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;appearance:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.tabs2 button.on{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.item:first-of-type{border-top:0;padding-top:0}
.diasel{display:flex;gap:4px;flex-wrap:wrap}
.diasel button{appearance:none;width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;cursor:pointer}
.diasel button.on{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.toggle{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--ball);position:relative;flex:none;border:0;cursor:pointer;padding:0}
.toggle::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#0a0d00;transition:all .15s}
.toggle.off{background:#2a3134}.toggle.off::after{right:23px;background:#8c958b}
.xbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
.guardar-bar{padding-top:4px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:62px}
.day b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.day span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day.on{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}.day.on span{color:var(--ball-ink)}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.court-c{position:relative;border-radius:6px;padding:36px 12px 16px;background:linear-gradient(180deg,#0f4f8a,#0b3e6e);border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 5px #13202b,0 0 24px rgba(0,140,255,.25);overflow:hidden}
.court-c .net{position:absolute;left:0;right:0;top:50%;border-top:3px dashed rgba(255,255,255,.9)}
.court-c .sl1,.court-c .sl2{position:absolute;left:0;right:0;border-top:2px solid rgba(255,255,255,.4)}
.court-c .sl1{top:24%}.court-c .sl2{bottom:24%}
.court-c .cl{position:absolute;left:50%;top:24%;bottom:24%;border-left:2px solid rgba(255,255,255,.4)}
.court-c .nm{position:absolute;left:0;right:0;top:7px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.court-c .lib{position:absolute;right:8px;top:9px;font-size:11px;color:#cfe7ff}
.slots{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{appearance:none;border:1px solid rgba(212,255,31,.9);background:rgba(5,20,35,.82);color:var(--ball);border-radius:8px;padding:7px 2px;font:600 13px/1.1 var(--f-body);text-align:center;font-variant-numeric:tabular-nums;cursor:default}
.slot small{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:2px}
.slot.ocupado{border-color:rgba(255,255,255,.18);background:rgba(10,15,20,.8);color:rgba(255,255,255,.45)}
.slot.ocupado b{text-decoration:line-through;font-weight:600}
.slot.reta{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.slot.pasado{opacity:.32}
.editando .slot:not(.reta):not(.pasado){cursor:pointer}
.editando .court-c{box-shadow:0 0 0 5px var(--ball),0 0 24px rgba(212,255,31,.35)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid}
.fotos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.fotos::-webkit-scrollbar{display:none}
.fotos img{flex:none;width:86%;max-width:560px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;scroll-snap-align:start;background:var(--surface)}
.fotos img:only-child{width:100%}
.club-card{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--ink);font:inherit}
.club-card:hover{border-color:var(--ball)}
.club-card .ph{width:100px;height:80px;border-radius:8px;object-fit:cover;background:linear-gradient(180deg,#0f4f8a,#0b3e6e);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:26px}
.club-card .alias{font-size:21px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:72px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.thumb button{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer;padding:0}
.linkclub{appearance:none;border:0;background:none;color:inherit;padding:0;font:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--ball);text-decoration-thickness:3px;text-underline-offset:7px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}
.acciones .btn{flex:1 1 140px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.acciones a.btn:not(.wa){color:var(--ink)}

.share{display:flex;gap:10px;flex-wrap:wrap}
.share .btn{flex:1 1 140px}
.btn.wa{background:#25d366;border-color:#25d366;color:#04210f;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.wa svg{width:20px;height:20px;flex:none}
.preview{white-space:pre-wrap;font-size:14px;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:260px;overflow:auto;user-select:text}
.chip.falta{background:transparent;border:1px solid var(--ball);color:var(--ball)}
.chip.busca{background:#ff5a1f;color:#fff;animation:late 1.6s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 0 4px rgba(255,90,31,.25)}}
.chip.nivel{background:transparent;border:1px solid var(--line);color:var(--ink)}
.nv{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;border:1px solid var(--ball);color:var(--ball);font:700 10px/1.4 var(--f-body);letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.falta-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:14px;border:1px solid #ff5a1f;background:linear-gradient(120deg,rgba(255,90,31,.16),rgba(255,90,31,.04))}
.falta-box .btn{flex:none}
.sug{padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13px}
.fmt-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 22px minmax(0,1fr) minmax(0,1fr) 34px;gap:6px;align-items:center}
.fmt-row input{text-align:center;padding:8px 2px;min-width:0;width:100%}
.fmt-row b{text-align:center;font-size:12px}
.map-row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.map-row:first-child{border-top:0}
.pts-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pts-row input{width:52px;text-align:center;padding:8px 4px}
.res-m{display:grid;grid-template-columns:52px 1fr auto 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}

/* ---------- sorteos ---------- */
function sortearRoyal(ids,canchas,rondas){
  const courts=Math.max(1,Math.min(canchas,Math.floor(ids.length/4)));const k=(a,b)=>a<b?a+"|"+b:b+"|"+a;
  const una=()=>{const played={},partner={},opp={},rest={};ids.forEach(i=>{played[i]=0;rest[i]=-9});const out=[];let costo=0;
    for(let r=1;r<=rondas;r++){
      const pref=Math.random()<.6;const pool=shuffle(ids.slice()).sort((a,b)=>(played[a]-played[b])||(pref?((rest[b]===r-1)-(rest[a]===r-1)):0));
      const playing=pool.slice(0,courts*4);pool.slice(courts*4).forEach(i=>{if(rest[i]===r-1)costo+=30;rest[i]=r});
      let best=playing,bs=Infinity;
      for(let t=0;t<600;t++){const p=shuffle(playing.slice());let sc=0;
        for(let c=0;c<courts;c++){const[a,b,x,y]=p.slice(c*4,c*4+4);sc+=((partner[k(a,b)]||0)+(partner[k(x,y)]||0))*100;for(const i of[a,b])for(const j of[x,y])sc+=opp[k(i,j)]||0}
        if(sc<bs){bs=sc;best=p;if(!sc)break}}
      costo+=bs;
      for(let c=0;c<courts;c++){const[a,b,x,y]=best.slice(c*4,c*4+4);
        out.push({id:"r"+r+"c"+(c+1),ronda:r,cancha:c+1,a:[a,b],b:[x,y]});
        [a,b,x,y].forEach(i=>played[i]++);partner[k(a,b)]=(partner[k(a,b)]||0)+1;partner[k(x,y)]=(partner[k(x,y)]||0)+1;
        for(const i of[a,b])for(const j of[x,y])opp[k(i,j)]=(opp[k(i,j)]||0)+1}}
    const v=Object.values(played);costo+=(Math.max(...v)-Math.min(...v))*1000;return{out,costo}};
  let mejor=null;for(let t=0;t<60;t++){const x=una();if(!mejor||x.costo<mejor.costo)mejor=x;if(mejor.costo===0)break}
  return mejor.out;
}
function minPartido(r){return Math.round(r.modo==="total"?(r.puntos||24)*.85:(r.puntos||21)*1.5)}
function fmtDur(min){min=Math.round(min/5)*5;const h=Math.floor(min/60),m=min%60;return h?(h+" h"+(m?" "+m+" min":"")):m+" min"}
function opcionesRondas(n,canchas){
  const courts=Math.max(1,Math.min(canchas,Math.floor(n/4)));const slots=courts*4;const o=[];
  for(let R=1;R<=16;R++){const tot=R*slots;const min=Math.floor(tot/n),max=Math.ceil(tot/n);o.push({R,parejo:tot%n===0,min,max,extra:tot%n})}
  const parejas=o.filter(x=>x.parejo&&x.min>=3&&x.min<=7);
  let def=parejas.length?parejas.reduce((a,b)=>Math.abs(b.min-4.5)<Math.abs(a.min-4.5)?b:a):o.reduce((a,b)=>Math.abs((b.min+b.max)/2-4.5)<Math.abs((a.min+a.max)/2-4.5)?b:a);
  if(slots===n)def=o[Math.min(n-1,8)-1]||def;
  return{o,def:def.R,courts};
}
function sortearFija(pairs,canchas){
  let P=pairs.map((_,i)=>i);if(P.length%2)P.push(-1);const m=P.length;const rounds=[];
  for(let r=0;r<m-1;r++){const ms=[];for(let i=0;i<m/2;i++){const x=P[i],y=P[m-1-i];if(x>=0&&y>=0)ms.push([x,y])}rounds.push(shuffle(ms));P=[P[0],P[m-1],...P.slice(1,m-1)]}
  const out=[];let ronda=0;
  rounds.forEach(ms=>{for(let i=0;i<ms.length;i+=canchas){ronda++;ms.slice(i,i+canchas).forEach((mm,j)=>out.push({id:"r"+ronda+"c"+(j+1),ronda,cancha:j+1,a:pairs[mm[0]],b:pairs[mm[1]]}))}});
  return out;
}
const pairsOf=ids=>{const o=[];for(let i=0;i+1<ids.length;i+=2)o.push([ids[i],ids[i+1]]);return o};

/* ---------- estadísticas ---------- */
function computeStats(){
  const st={};const g=id=>st[id]??={elo:1000,pj:0,pg:0,pe:0,pp:0,pf:0,pc:0,last:[],sets:0,retas:0};
  for(const[rid,r] of Object.entries(S.retas).sort((a,b)=>-retaOrder(a,b))){
    if(esHist(r)){for(const f of r.partidos||[]){if(!f||!f.jugadorId)continue;const p=g(f.jugadorId);p.sets+=Number(f.total)||0;p.retas++}continue}
    const enReta=new Set();
    for(const m of(r.partidos||[]).slice().sort((x,y)=>x.ronda-y.ronda||x.cancha-y.cancha)){
      const s=S.scores[scoreKey(rid,m.id)];if(!s||s.a==null||s.b==null)continue;
      const A=m.a.map(g),B=m.b.map(g);const ra=A.reduce((t,p)=>t+p.elo,0)/A.length,rb=B.reduce((t,p)=>t+p.elo,0)/B.length;
      const ea=1/(1+Math.pow(10,(rb-ra)/400));const sa=s.a>s.b?1:s.a<s.b?0:.5;const d=24*(sa-ea);
      m.a.concat(m.b).forEach(x=>enReta.add(x));
      A.forEach(p=>{p.sets+=s.a;p.elo+=d;p.pj++;p.pf+=s.a;p.pc+=s.b;sa===1?p.pg++:sa===0?p.pp++:p.pe++;p.last.push(sa)});
      B.forEach(p=>{p.sets+=s.b;p.elo-=d;p.pj++;p.pf+=s.b;p.pc+=s.a;sa===0?p.pg++:sa===1?p.pp++:p.pe++;p.last.push(1-sa)});
    }
    enReta.forEach(x=>g(x).retas++);
  }return st;
}
function retaTable(rid,r){
  const fija=r.tipo==="fija";const rows={};
  const key=t=>fija?t.slice().sort().join("+"):null;
  const ensure=(k,ids)=>rows[k]??={ids,pj:0,pg:0,pf:0,pc:0};
  if(fija)pairsOf(r.jugadores||[]).forEach(p=>ensure(key(p),p));else(r.jugadores||[]).forEach(id=>ensure(id,[id]));
  for(const m of r.partidos||[]){const s=S.scores[scoreKey(rid,m.id)];if(!s||s.a==null||s.b==null)continue;
    const sides=[[m.a,s.a,s.b],[m.b,s.b,s.a]];
    for(const[team,f,c] of sides){const ks=fija?[key(team)]:team;ks.forEach(k=>{const r0=ensure(k,fija?team:[k]);r0.pj++;r0.pf+=f;r0.pc+=c;if(f>c)r0.pg++})}}
  return Object.values(rows).sort((a,b)=>b.pg-a.pg||(b.pf-b.pc)-(a.pf-a.pc)||b.pf-a.pf);
}

const aMin=h=>{const[a,b]=String(h||"0:0").split(":").map(Number);return a*60+(b||0)};

function slotsClub(c,fecha){
  const ap=aMin(c.apertura||"07:00"),ci=aMin(c.cierre||"23:00"),tu=Number(c.turno)||90,n=Math.max(1,Number(c.canchas)||1);
  const ahora=new Date();const hoy=today();const minAhora=ahora.getHours()*60+ahora.getMinutes();
  const bl={};(S.bloqueos||[]).forEach(b=>{if(b.clubId===c.id&&b.fecha===fecha)bl[b.cancha+"_"+b.hora]=b});
  const rs=Object.entries(S.retas).filter(([,r])=>!esHist(r)&&r.fecha===fecha&&norm(r.club||r.clubTexto)===norm(c.nombre));
  const out=[];
  const info=c.canchasInfo||[];
  for(let k=1;k<=n;k++){const lista=[];const off=info[k-1]&&info[k-1].activa===false;
    for(let m=ap;m+tu<=ci;m+=tu){const h=deMin(m);let est="libre",nota="";
      const reta=rs.find(([,r])=>k<=(r.canchas||1)&&m<aMin(r.hora)+RETA_MIN&&m+tu>aMin(r.hora));
      if(off){est="ocupado";nota="Fuera"}
      else if(reta){est="reta";nota="Reta"}
      else if(bl[k+"_"+h]){est="ocupado";nota=bl[k+"_"+h].nota||"Ocupado"}
      const pas=fecha<hoy||(fecha===hoy&&m+tu<=minAhora);
      const pr=precioEn(c,fecha,m);

    out.push(lista)}
  return out;
}

async function comprimirFoto(file,max){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,(max||1600)/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",.82).split(",")[1];}
  finally{URL.revokeObjectURL(url)}
}

      if(!j){const c=document.getElementById("nj-cel");if(c)c.value=dig;document.getElementById("nj-ali")?.focus()}}).catch(er=>{box.innerHTML=`<p class="muted small" style="margin:0">${esc(er.message)}</p>`}),400)}

  partidos.forEach(m=>{const A=m.a.map(p=>pts(p,m)),B=m.b.map(p=>pts(p,m));const va=A.find(x=>x!=null),vb=B.find(x=>x!=null);
    m.pa=va??null;m.pb=vb??null;
    if(A[0]!=null&&A[1]!=null&&A[0]!==A[1]||B[0]!=null&&B[1]!=null&&B[0]!==B[1])m.aviso="los compañeros no tienen los mismos puntos";

  return{partidos,avisos,jug};

async function guardarFoto(){const F=S.foto;if(!F)return;
  try{

      await crearNuevos(F.map);const ids=k=>F.map[k].sel;const idx=t=>F.nombres.findIndex(y=>normTxt(y)===normTxt(t));

      const jug=[...new Set(F.map.map(m=>m.sel))];const canchas=Math.max(1,...(F.datos.rondas||[]).map(rd=>(rd.partidos||[]).length));

    if(F.fuente.startsWith("formato:")){const fm=S.formatos[F.fuente.slice(8)];

        partidos:C.partidos.map(m=>({ronda:m.ronda,cancha:m.cancha,a:m.a,b:m.b,pa:m.pa,pb:m.pb}))},"Resultado guardado");if(r){S.foto=null;go("reta",{retaId:r.reta.id})}return}
    const r=await act("guardarJugada",{historica:true,club:F.club,fecha:F.fecha,hora:F.hora,jugadores:filas.map(f=>f.sel),filas:filas.map(f=>({jugadorId:f.sel,sets:(f.puntos||[]).map(v=>v===""?null:+v),total:""})),fotos:F.fotoId?[F.fotoId]:[]},"Puntos guardados en el ranking");

function vRanking(){
  const st=computeStats();const modo=S.rkModo||"sets";const val=x=>modo==="sets"?x.sets:x.elo;
  Object.keys(S.players).forEach(id=>{st[id]??={elo:1000,pj:0,pg:0,pe:0,pp:0,pf:0,pc:0,last:[],sets:0,retas:0}});
  const rows=Object.entries(st).filter(([id])=>S.players[id]).sort((a,b)=>val(b[1])-val(a[1])||b[1].elo-a[1].elo||pname(a[0]).localeCompare(pname(b[0])));
  const lo=rows.length?Math.min(...rows.map(r=>val(r[1]))):0,hi=rows.length?Math.max(...rows.map(r=>val(r[1]))):0;
  const trend=l=>l.slice(-5).map(x=>x===1?"G":x===0?"P":"E").join(" ");
  const of=oficial();let pos=0,prev=null;
  return`<div class="stack"><div class="section-head"><h1>Ranking</h1><span class="muted small">${rows.length} jugadores</span></div>${of?heroHTML(of):""}
  <div class="seg" role="tablist"><label><input type="radio" name="rk" data-act="rkModo" value="sets" ${modo==="sets"?"checked":""}>Puntos</label><label><input type="radio" name="rk" data-act="rkModo" value="rating" ${modo==="rating"?"checked":""}>Rating</label></div>
  <p class="muted" style="margin:0">${modo==="sets"?"<b>Puntos</b> suma los puntos ganados en todas las retas: las históricas cargadas de las fotos y cada partido capturado en la app.":"Todos empiezan en 1000. Cada partido compara el promedio de las dos parejas: ganarle a una pareja más fuerte da más puntos y perder con una más débil quita más. <b>Dif</b> = puntos anotados menos puntos recibidos."}</p>
  ${rows.length?`<div class="panel tbl-wrap rk"><table><thead><tr><th>#</th><th>Jugador</th>${modo==="sets"?"<th>Puntos</th><th>Retas</th><th>Rating</th>":"<th>Rating</th><th>PJ</th><th>PG</th><th>%</th><th>Dif</th><th>Últimos</th><th>Puntos</th>"}</tr></thead><tbody>
  ${rows.map(([id,x],i)=>{const v=val(x);if(v!==prev){pos=i+1;prev=v}const g=hi>lo?(v-lo)/(hi-lo):1;
    const celdas=modo==="sets"?`<td class="elo">${x.sets}</td><td>${x.retas}</td><td>${Math.round(x.elo)}</td>`
      :`<td class="elo">${Math.round(x.elo)}</td><td>${x.pj}</td><td>${x.pg}</td><td>${x.pj?Math.round(x.pg/x.pj*100):0}</td><td class="${x.pf-x.pc>0?"up":x.pf-x.pc<0?"down":""}">${x.pf-x.pc>0?"+":""}${x.pf-x.pc}</td><td class="muted small">${trend(x.last)}</td><td>${x.sets}</td>`;
    return`<tr class="${pos<=3?"top":""}${id===S.uid?" yo":""}" style="--g:${g.toFixed(3)}"><td class="pos ${pos<=3?"m"+pos:""}">${pos}</td><td class="nm"><b>${esc(pname(id))}</b>${nvTag(id)}<div class="muted small">${esc(pfull(id))}</div></td>${celdas}</tr>`}).join("")}
  </tbody></table></div>`:`<div class="panel empty"><strong>Aún sin partidos</strong>El ranking se arma solo en cuanto se capturen marcadores en las retas.</div>`}</div>`;
}

/* ---------- conexión con el servidor ---------- */
function getTok(){try{return localStorage.getItem("lareta_token")||""}catch(e){return S._tok||""}}
function setTok(t){S._tok=t;try{t?localStorage.setItem("lareta_token",t):localStorage.removeItem("lareta_token")}catch(e){}}
let busyN=0;function busy(d){busyN=Math.max(0,busyN+d);document.body.classList.toggle("busy",busyN>0)}
function call(accion,datos){
  return new Promise((res,rej)=>{
    busy(1);
    if(!(window.google&&google.script&&google.script.run)){
      fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:getTok(),accion,datos:datos||{}})})
        .then(x=>x.json()).then(r=>{busy(-1);
          if(r&&r.ok){if(r.todo){S.todoAt=Date.now();if(apply(r.todo)){S.keepScroll=true;render()}}return res(r.data)}
          if(r&&r.sesion===false){setTok("");S.uid=null;S.yo=null;S.isOwner=false;S.canWrite=false;go("inicio");refresh(true)}
          rej(new Error((r&&r.error)||"No se pudo completar."))})
        .catch(()=>{busy(-1);rej(new Error("Sin conexión. Revisa tu internet e intenta de nuevo."))});
      return;
    }
    google.script.run.withSuccessHandler(r=>{busy(-1);
      if(r&&r.ok)return res(r.data);
      if(r&&r.sesion===false){setTok("");S.uid=null;S.yo=null;S.isOwner=false;S.canWrite=false;go("inicio");refresh(true)}
      rej(new Error((r&&r.error)||"No se pudo completar."))
    }).withFailureHandler(e=>{busy(-1);rej(new Error("Sin conexión. Revisa tu internet e intenta de nuevo."))}).api(getTok(),accion,datos||{});
  });
}
function apply(d){
  if(!d||d.igual)return false;
  S.version=d.version;S.yo=d.yo||null;S.uid=S.yo?S.yo.id:null;S.isOwner=!!d.admin;S.canWrite=!!S.uid;
  S.players=Object.fromEntries((d.jugadores||[]).map(j=>[j.id,j]));
  S.clubs=Object.fromEntries((d.clubs||[]).map(c=>[c.id,c]));
  S.retas=Object.fromEntries((d.retas||[]).map(r=>[r.id,r]));
  S.scores=Object.fromEntries((d.marcadores||[]).map(m=>[m.id,m]));
  S.multas=Object.fromEntries((d.multas||[]).map(m=>[m.id,m]));
  S.bloqueos=d.bloqueos||[];
  S.sponsors=Object.fromEntries((d.patrocinadores||[]).map(p=>[p.id,p]));
  S.formatos=Object.fromEntries((d.formatos||[]).map(f=>[f.id,f]));S.fotosOk=!!d.fotosOk;
  const av=d.avisos||[];
  if(S.uid&&S.avisosVistos){av.filter(a=>!a.leido&&!S.avisosVistos.has(a.id)).slice(0,3).forEach(notificar)}
  S.avisos=av;S.avisosVistos=new Set(av.map(a=>a.id));
  S.loadedPlayers=true;S.status="ready";
  try{if(getTok()||!d.yo)localStorage.setItem("lareta_cache",JSON.stringify({t:getTok().slice(-16),d}))}catch(e){}
  renderSpons();return true;
}
async function refresh(force){
  try{const d=await call(getTok()?"todo":"publico",{version:force?"":S.version});if(apply(d)){S.keepScroll=true;render()}}
  catch(e){if(S.status==="loading"){S.status="error";S.err=e.message;render()}}
}
async function act(accion,datos,msg){
  try{const t0=Date.now();const r=await call(accion,datos);if(!(S.todoAt>=t0))await refresh(true);if(msg)flash(msg);return r}
  catch(e){flash(e.message);refresh(true);return null}
}

  if(a==="resetPin"){const id=t.dataset.id;const r=await act("resetPin",{jugadorId:id});if(r){S.pinNuevo={id,pin:r.pin};S.cuentas=await call("jugadoresAdmin").catch(()=>S.cuentas);render();window.scrollTo(0,0)}return}
  if(a==="bloquear"){await act("estadoJugador",{jugadorId:t.dataset.id,estado:t.dataset.e},t.dataset.e==="bloqueado"?"Cuenta bloqueada":"Cuenta activa");S.cuentas=await call("jugadoresAdmin").catch(()=>S.cuentas);return render()}
  if(a==="fotoTipo"){S.foto=nuevaFoto(t.dataset.t);return render()}
  if(a==="fotoCancelar"){S.foto=null;window.scrollTo(0,0);return render()}
  if(a==="fotoGuardar"){t.disabled=true;await guardarFoto();t.disabled=false;return}
  if(a==="fmtQuitar"){const F=S.foto;F.datos.rondas[+t.dataset.i].partidos.splice(+t.dataset.k,1);F.datos.rondas=F.datos.rondas.filter(rd=>rd.partidos.length);S.keepScroll=true;return render()}
  if(a==="verFormato"){S.verFormato=S.verFormato===t.dataset.id?null:t.dataset.id;S.keepScroll=true;return render()}
  if(a==="borrarFormato"){if(S.confirmFmt!==t.dataset.id){S.confirmFmt=t.dataset.id;t.textContent="¿Seguro?";return}S.confirmFmt=null;return act("borrarFormato",{id:t.dataset.id},"Formato borrado")}
  if(a==="podio"){const r0=S.retas[S.retaId];if(!r0)return;flash("Armando la imagen…");
    try{let c=await podioCanvas(S.retaId,r0);let blob=null;try{blob=await new Promise(res=>c.toBlob(res,"image/png"))}catch(er){}
      if(!blob){for(const k in imgCache)imgCache[k]=null;c=await podioCanvas(S.retaId,r0);blob=await new Promise(res=>c.toBlob(res,"image/png"))}mostrarPodio(blob,"podio-"+normTxt(clubName(r0)).replace(/[^a-z0-9]+/g,"-")+"-"+r0.fecha+".png",r0)}catch(er){console.warn(er);flash("No se pudo armar la imagen.")}return}
  const rid=S.retaId,r=S.retas[rid];if(!r||!S.uid)return;
  if(a==="insCel"){const id=t.dataset.id;let ins=(r.jugadores||[]).slice();if(ins.includes(id))return flash("Ya está inscrito.");if(ins.length>=r.maxJugadores)return flash("La reta ya está llena.");
    ins.push(id);if(!S.players[id]){S.version="";await refresh(true)}return setIns(r,ins,"Inscrito")}
  if(a==="faltaUno"){t.disabled=true;try{const x=await call("faltaUno",{retaId:rid});S.retas[rid]=x.reta;S.version="";
      flash(x.avisados?`Listo: avisé a ${x.avisados} jugador${x.avisados>1?"es":""} de tu nivel.`:"No encontré más jugadores a quién avisar.")}catch(er){flash(er.message)}S.keepScroll=true;return render()}
  if(a==="join"||a==="leave"){let ins=(r.jugadores||[]).filter(x=>x!==S.uid);if(a==="join"){if(ins.length>=r.maxJugadores)return flash("La reta ya está llena.");ins.push(S.uid)}
    return setIns(r,ins,a==="join"?"Quedaste apuntado":"Te saliste de la reta")}
  if(a==="swap"){const ins=r.jugadores.slice();const i=+t.dataset.i;const full=ins.length-(ins.length%2);const k=(i+2)%full;[ins[i],ins[k]]=[ins[k],ins[i]];return setIns(r,ins)}
  if(a==="mixPairs")return setIns(r,shuffle(r.jugadores.slice()));
  if(a==="mezclarPos"){const ins=shuffle((r.jugadores||[]).slice());return setIns(r,ins,"Posiciones sorteadas")}
  if(a==="usarFormato"){const f=S.formatos[t.dataset.fid];const ins=r.jugadores||[];if(!f||ins.length!==+f.nJugadores)return flash("El formato es para "+(f?f.nJugadores:"?")+" jugadores.");
    const ps=[];f.rondas.forEach(rd=>rd.partidos.forEach(m=>ps.push({id:"r"+rd.ronda+"c"+m.cancha,ronda:rd.ronda,cancha:m.cancha,a:m.a.map(x=>ins[x-1]),b:m.b.map(x=>ins[x-1])})));
    S.formatoSel=null;S.keepScroll=true;return act("partidos",{retaId:rid,partidos:ps},"Partidos armados con el formato del club")}
  if(a==="fotoResultado"){S.foto={tipo:"resultado",paso:"elegir",fuente:"reta:"+rid,fecha:r.fecha,hora:r.hora,club:clubName(r)};return go("fotos")}
  if(a==="sortear"){const ins=r.jugadores||[];let ps;
    if(r.tipo==="fija")ps=sortearFija(pairsOf(ins),r.canchas);else ps=sortearRoyal(ins,r.canchas,Math.max(1,S.rondasSel||+document.getElementById("rondas")?.value||4));
    S.keepScroll=true;return act("partidos",{retaId:rid,partidos:ps},"Partidos sorteados")}
  if(a==="resortear"){S.keepScroll=true;return act("partidos",{retaId:rid,partidos:[]})}
  if(a==="multa"){const pid=t.dataset.id;const k=scoreKey(rid,pid);const cambio=+t.dataset.d;const n=Math.max(0,((S.multas[k]||{}).n||0)+cambio);S.multas[k]={id:k,retaId:rid,jugadorId:pid,n};S.keepScroll=true;render();
    return call("multa",{retaId:rid,jugadorId:pid,cambio}).catch(er=>{flash(er.message);refresh(true)})}
  if(a==="delReta"){go("retas");return act("borrarReta",{retaId:rid},"Reta borrada")}
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.closest("form[data-form='reta']")&&t.type!=="text"&&t.name!=="extra"&&t.name!=="clubTexto"&&t.name!=="castigo"){readDraft(t.closest("form"));S.keepScroll=true;t.blur();render();return}
  if(t.dataset.f){let v=t.type==="checkbox"?t.checked:t.value;if(t.dataset.t==="num")v=v===""?"":+v;setPath(S.cd,t.dataset.f,v);if(t.dataset.re){S.keepScroll=true;t.blur();render()}return}
  if(t.dataset.act==="fotosClub"&&t.files&&t.files.length){const fs=[...t.files].slice(0,8-S.cd.fotos.length);t.value="";const c=myClub();
    (async()=>{for(const f of fs){try{flash("Subiendo foto…");const b64=await comprimirFoto(f);const r=await call("subirImagen",{para:"club",clubId:c?c.id:"",tipo:"image/jpeg",base64:b64});S.cd.fotos.push(r.imagenId);S.keepScroll=true;document.activeElement?.blur();render()}catch(er){flash(er.message||"No se pudo subir la foto.")}}
      flash(myClub()?"Fotos listas. Toca Guardar cambios.":"Primero registra tu club y luego agrega fotos.")})();return}
  if(t.dataset.act==="sponimg"&&t.files&&t.files[0]){const f=t.files[0];if(f.size>1048576){t.value="";return flash("La imagen pesa más de 1 MB. Redúcela e intenta de nuevo.")}
    const rd=new FileReader();rd.onload=()=>{const b64=String(rd.result).split(",")[1];flash("Subiendo imagen…");
      call("subirImagen",{tipo:f.type,base64:b64}).then(r=>{S.sponImg=r.imagenId;S.keepScroll=true;document.activeElement?.blur();render();flash("Imagen lista. Guarda para aplicarla.")}).catch(er=>flash(er.message))};
    rd.readAsDataURL(f);return}
  const sf=t.closest("form[data-form='spon']");if(sf){const svg=sf.querySelector("svg");if(svg){const fd=new FormData(sf);svg.outerHTML=logoSVG({nombre:fd.get("nombre"),siglas:fd.get("siglas"),forma:fd.get("forma"),color:fd.get("color"),tinta:fd.get("tinta")},56)}return}
  if(t.dataset.act==="nivelAdm"){const id=t.dataset.id,n=+t.value;t.blur();call("nivelJugador",{id,nivel:n}).then(j=>{if(S.players[id])S.players[id].nivel=j.nivel;flash("Categoría guardada")}).catch(er=>flash(er.message));return}
  if(t.dataset.fx&&S.foto){let v=t.value;if(t.dataset.t==="num")v=v===""?"":+v;setPath(S.foto,t.dataset.fx,v);if(t.dataset.re){S.keepScroll=true;if(t.tagName==="SELECT"||t.type==="radio")t.blur();render()}return}
  if(t.dataset.act==="fotoArchivo"&&t.files&&t.files[0]){const f=t.files[0];t.value="";leerArchivoFoto(f);return}
  if(t.dataset.act==="formatoSel"){S.formatoSel=t.value?{rid:S.retaId,fid:t.value}:null;S.keepScroll=true;t.blur();return render()}
  if(t.dataset.act==="rondasSel"){S.rondasSel=+t.value;S.keepScroll=true;t.blur();return render()}
  if(t.dataset.act==="rkModo"){S.rkModo=t.value;try{localStorage.setItem("lareta_rk",t.value)}catch(er){}S.keepScroll=true;t.blur();return render()}
  const a=t.dataset.act;const rid=S.retaId,r=S.retas[rid];if(!r||!S.uid)return;
  if(a==="ins"){let ins=(r.jugadores||[]).slice();const id=t.dataset.id;
    if(t.checked){if(ins.length>=r.maxJugadores){t.checked=false;return flash("La reta ya está llena.")}if(!ins.includes(id))ins.push(id)}else ins=ins.filter(x=>x!==id);
    setIns(r,ins);return}
  if(a==="score"){const mid=t.dataset.m;const k=scoreKey(rid,mid);const cur={...(S.scores[k]||{id:k,retaId:rid,matchId:mid,a:null,b:null})};
    const v=t.value===""?null:Math.max(0,Math.min(99,Math.round(+t.value)));cur[t.dataset.side]=v;
    S.scores[k]=cur;S.keepScroll=true;S.dirty=true;
    setTimeout(()=>{const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest("#main")&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()},60);
    call("marcador",{retaId:rid,matchId:mid,a:cur.a,b:cur.b}).catch(er=>{flash(er.message);refresh(true)})}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.fx&&S.foto&&t.type!=="radio"&&t.tagName!=="SELECT"){let v=t.value;if(t.dataset.t==="num")v=v===""?"":+v;setPath(S.foto,t.dataset.fx,v);return}if(t.dataset&&t.dataset.buscar==="ins"){filtrarIns(t.value);return}if(!t.dataset||!t.dataset.f||!S.cd||t.dataset.re)return;let v=t.value;if(t.dataset.t==="num")v=v===""?"":+v;setPath(S.cd,t.dataset.f,v)});
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.dirty&&!document.activeElement?.closest?.("#main input,#main select,#main textarea")){S.keepScroll=true;render()}},0));

document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const kind=f.dataset.form;const fd=new FormData(f);const g=k=>String(fd.get(k)||"").trim();
  document.activeElement?.blur();
  if(kind==="login"){const cel=g("celular").replace(/\D/g,""),pin=g("pin");
    if(cel.length!==10)return flash("Escribe tu celular a 10 dígitos.");if(!/^\d{6}$/.test(pin))return flash("El PIN es de 6 números.");
    try{let r;try{r=await call("entrar",{celular:cel,pin})}catch(er){if(/aún no tienes PIN/.test(er.message)){S.preCel=cel;go("registro");flash("Ya te dieron de alta. Crea tu PIN aquí con tu nombre.");return}throw er}setTok(r.token);S.welcomed=true;S.version="";await refresh(true);if(S.volverReta&&S.retas[S.volverReta]){go("reta",{retaId:S.volverReta});S.volverReta=null}else go("retas");activarPush(false);flash("Hola, "+(r.yo.alias||r.yo.nombre))}catch(er){flash(er.message)}return}
  if(kind==="registro"){const cel=g("celular").replace(/\D/g,""),pin=g("pin");
    if(!g("nombre"))return flash("Escribe tu nombre.");if(cel.length!==10)return flash("Escribe tu celular a 10 dígitos.");
    if(!/^\d{6}$/.test(pin))return flash("El PIN debe ser de 6 números.");if(pin!==g("pin2"))return flash("Los dos PIN no coinciden.");
    try{const r=await call("registro",{nombre:g("nombre"),apellido:g("apellido"),alias:g("alias"),celular:cel,pin});setTok(r.token);S.welcomed=true;S.version="";await refresh(true);
      const next=S.afterReg==="club"?"club":"retas";S.afterReg=null;if(next==="retas"&&S.volverReta&&S.retas[S.volverReta]){go("reta",{retaId:S.volverReta});S.volverReta=null}else go(next);activarPush(false);S.preCel="";flash(r.reclamado?"¡Listo! Ya tienes tu PIN. Tus retas y puntos se conservaron.":r.yo.rol==="ADMIN"?"Cuenta creada. Eres el administrador.":"¡Listo! Ya estás registrado.")}catch(er){flash(er.message)}return}
  if(kind==="nuevoJug"){const cel=g("celular").replace(/\D/g,"");if(!g("alias"))return flash("Escribe el alias.");if(cel.length!==10)return flash("Escribe el celular a 10 dígitos.");
    const r=await act("agregarJugador",{alias:g("alias"),celular:cel,retaId:S.retaId},"Jugador agregado e inscrito");if(r){S.keepScroll=true;render()}return}
  if(kind==="agregarCuenta"){const cel=g("celular").replace(/\D/g,"");if(cel.length!==10)return flash("Escribe el celular a 10 dígitos.");const jid=g("jugadorId");if(!jid&&!g("alias"))return flash("Escribe el alias.");
    const r=await act("agregarJugador",{alias:g("alias"),celular:cel,jugadorId:jid},jid?"Celular guardado":"Jugador agregado");if(r){S.cuentas=await call("jugadoresAdmin").catch(()=>S.cuentas);f.reset();render()}return}
  if(kind==="gemini"){if(!g("llave"))return flash("Pega la llave.");const r=await act("llaveGemini",{llave:g("llave")},"Lectura de fotos activada");if(r){f.reset();S.version="";refresh(true)}return}
  if(kind==="perfil"){if(!g("nombre"))return flash("Escribe tu nombre.");return act("perfil",{nombre:g("nombre"),apellido:g("apellido"),alias:g("alias"),nivel:+fd.get("nivel")||0},"Perfil guardado")}
  if(kind==="pin"){if(!/^\d{6}$/.test(g("nuevo")))return flash("El PIN nuevo debe ser de 6 números.");if(g("nuevo")!==g("nuevo2"))return flash("Los PIN nuevos no coinciden.");
    const r=await act("cambiarPin",{actual:g("actual"),nuevo:g("nuevo")});if(r){S.showPin=false;render();flash("PIN cambiado")}return}
  if(kind==="club"){if(!g("nombre"))return flash("Escribe el nombre del club.");
    const cc=myClub();const r=await act("club",{id:cc?cc.id:"",nombre:g("nombre"),descripcion:g("descripcion"),ciudad:g("ciudad"),direccion:g("direccion"),canchas:+fd.get("canchas")||1,telefono:g("telefono"),horario:g("horario"),apertura:g("apertura"),cierre:g("cierre"),turno:+fd.get("turno")||90,fotos:S.clubFotos||[]},"Club guardado");
    if(r){S.clubFotos=null;go("clubPub",{clubId:r.id})}return}
  if(kind==="spon"){const data={id:S.editSpon==="new"?"":S.editSpon,nombre:g("nombre"),giro:g("giro"),paquete:g("paquete"),cancha:+fd.get("cancha")||null,cuota:+fd.get("cuota")||0,
      forma:g("forma"),color:g("color"),tinta:g("tinta"),siglas:g("siglas").toUpperCase(),contacto:g("contacto"),premio:g("premio"),lema:g("lema"),activo:fd.get("activo")==="on"};
    const prev=S.editSpon!=="new"?(S.sponsors[S.editSpon]||{}).imagenId:"";data.imagenId=S.sponImg!==undefined?S.sponImg:(prev||"");
    if(!data.nombre)return flash("Escribe el nombre de la marca.");
    const r=await act("patrocinador",data,"Patrocinador guardado");if(r){S.editSpon=null;S.sponImg=undefined;render()}return}
  if(kind==="reta"){readDraft(f);const d=S.draft;if(!d.clubTexto.trim())return flash("Escribe el club.");
    const r=await act("crearReta",{club:d.clubTexto.trim(),fecha:d.fecha,hora:d.hora,canchas:d.canchas,maxJugadores:d.maxJugadores,tipo:d.tipo,puntos:d.puntos,modo:d.modo,reglas:d.reglas,castigo:d.castigo,nivel:d.nivel||""},"Jugada creada. Ahora elige a los jugadores.");
    if(r){S.draft=null;go("reta",{retaId:r.id,showInscribir:true})}}
});

/* ---------- instalar como app ---------- */
let instalarEvt=null;
const esStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instalarEvt=e;S.keepScroll=true;render()});
window.addEventListener("appinstalled",()=>{instalarEvt=null;flash("La Reta quedó instalada");render()});
function instalarHTML(){
  if(esStandalone())return"";
  if(instalarEvt)return`<div class="install"><div><b>Instala La Reta</b><div class="muted small">Queda en tu celular como cualquier app.</div></div><button class="btn primary sm" data-act="instalar">Instalar</button></div>`;
  if(esIOS())return`<div class="install"><div><b>Instala La Reta en tu iPhone</b><div class="muted small">Toca Compartir y luego "Agregar a pantalla de inicio".</div></div></div>`;
  return"";
}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act=instalar]");if(!t||!instalarEvt)return;instalarEvt.prompt();await instalarEvt.userChoice.catch(()=>{});instalarEvt=null;render()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- arranque ---------- */
(async()=>{
  S.version="";
  let cache=null;try{const c=JSON.parse(localStorage.getItem("lareta_cache")||"null");if(c&&c.d&&c.t===getTok().slice(-16))cache=c.d}catch(e){}
  if(cache){apply(cache);S.version=cache.version;refresh(false)}else await refresh(true);
  if(S.status!=="ready")return;
  S.view=S.uid?"retas":"ranking";
  try{const t=+localStorage.getItem("lareta_pushNo");if(t&&Date.now()-t<7*864e5)S.pushNo=true}catch(e){}
  render();
  if(S.uid&&permisoNotif()==="granted")activarPush(false).then(o=>{if(o){S.keepScroll=true;render()}});
  if(location.hash==="#avisos"&&S.uid){S.view="avisos";render()}
  const mh=location.hash.match(/^#reta-([A-Za-z0-9_-]+)$/);
  if(mh&&S.retas[mh[1]]){S.welcomed=true;go("reta",{retaId:mh[1]});try{history.replaceState(null,"",location.pathname)}catch(e){}}
  if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.retaId&&S.retas[e.data.retaId])go("reta",{retaId:e.data.retaId});else if(S.uid)go("avisos")});
  setInterval(()=>{if(S.dirty)return;if(document.hidden&&Date.now()-(S.ultimoBg||0)<60000)return;if(document.hidden)S.ultimoBg=Date.now();const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;refresh(false)},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh(false)});
})();
</script>
