@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}

/* Layout: app de una columna para celular; banda azul de cancha arriba, barra de pestañas abajo, tarjetas tipo marcador */
:root{
  --bg:#050607; --surface:#101315; --ink:#f2f5ec; --muted:#8c958b; --line:#242a2c;
  --court:#d4ff1f; --court-2:#bfea00; --on-court:#0a0d00; --ball:#d4ff1f; --ball-ink:#0a0d00; --head:#000000;
  --good:#3fe486; --bad:#ff5b4a; --soft:#1a1f21; --glow:0 0 12px rgba(212,255,31,.55);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--ink);border-bottom:2px solid var(--ball);box-shadow:0 2px 18px rgba(212,255,31,.25)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.03em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px;color:var(--ball);text-shadow:var(--glow)}

.top .sub{font-size:13px;opacity:.85}
main{padding-block:18px 160px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h1{color:var(--ink);font-size:30px;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--on-court);box-shadow:var(--glow)}
.btn.primary:hover{background:var(--court-2)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);box-shadow:var(--glow)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #ffffff;outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:460px){.grid3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{flex:1;text-align:center;padding:10px 6px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--court);color:var(--on-court)}
.seg label:has(input:focus-visible){outline:3px solid var(--ball);outline-offset:-3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;white-space:nowrap}
.chip.ball{background:var(--ball);color:var(--ball-ink)}
.chip.court{background:var(--court);color:var(--on-court)}
.chip.done{background:transparent;border:1px solid var(--line);color:var(--muted)}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.card:hover{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball),var(--glow)}
.card .when{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:10px}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .who{min-width:0}
.alias{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase}
.tel{user-select:all;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--court)}
.rules{margin:0;padding-left:18px}
.rules li{margin:2px 0}
/* marcador */
.ronda-h{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.match .ct{background:var(--court);color:var(--on-court);font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:5px 12px;display:flex;justify-content:space-between}
.side{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 12px}
.side + .side{border-top:1px dashed var(--line)}
.side .names{font-weight:600;min-width:0;overflow-wrap:anywhere}
.side.win .names::after{content:" ●";color:var(--good)}
.score{width:64px;height:48px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.score:read-only{border-color:transparent;background:transparent}
.warn{color:var(--bad);font-size:12px;padding:0 12px 8px}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
/* tablas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th:first-child,td:first-child{text-align:center;width:36px}
tr.first td{background:rgba(212,255,31,.14)}
tr.first .pos{color:var(--ball);text-shadow:var(--glow)}
.pos{font-family:var(--f-display);font-weight:800;font-size:18px}
.elo{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ball)}
.rk td.nm{background:linear-gradient(90deg,rgba(255,196,40,calc(.06 + var(--g)*.62)) 0%,rgba(255,170,20,calc(var(--g)*.25)) 60%,rgba(255,196,40,0) 100%);border-left:3px solid rgba(255,200,60,calc(.15 + var(--g)*.85))}
.rk td.nm b{color:color-mix(in srgb,#ffd45a calc(var(--g)*100%),var(--ink))}
.rk tr.top td.nm b{text-shadow:0 0 10px rgba(255,200,60,.6)}
.rk .pos.m1{color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.7)}.rk .pos.m2{color:#d9dde3}.rk .pos.m3{color:#e0904f}
.up{color:var(--good)} .down{color:var(--bad)}
.counter{display:flex;align-items:center;gap:6px}
.counter b{min-width:28px;text-align:center;font-family:var(--f-display);font-size:22px}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px}
.pair .n{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ball)}
.banner{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;text-transform:uppercase;margin-bottom:4px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--head);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr)}
.hd-r{display:flex;align-items:center;gap:10px;min-width:0}
.bell{position:relative;appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.bell svg{width:22px;height:22px}
.bell.on{border-color:var(--ball);color:var(--ball);box-shadow:var(--glow)}
.bell .n{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 12px/20px var(--f-body);text-align:center}
.av{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;cursor:pointer}
.av:first-child{border-top:0}
.av .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;background:transparent}
.av.nuevo .dot{background:var(--ball);box-shadow:var(--glow)}
.av.nuevo .tx{font-weight:600}
.me-btn{appearance:none;border:1px solid var(--ball);background:transparent;color:var(--ball);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spons{border-bottom:1px solid var(--line);overflow:hidden;position:relative;height:44px}
.spons .track{display:flex;gap:28px;align-items:center;height:44px;width:max-content;padding-inline:14px}
@media (prefers-reduced-motion:no-preference){.spons .track.go{animation:marq var(--dur,40s) linear infinite}}
@media (prefers-reduced-motion:reduce){.spons{overflow-x:auto}}
@keyframes marq{to{transform:translateX(-50%)}}
.slogo{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600;font-size:13px;color:var(--ink)}
.slogo svg{flex:none;display:block}
.slogo .t{display:flex;flex-direction:column;line-height:1.05}
.slogo .t small{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.presented{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid rgba(255,200,60,.55);border-radius:10px;padding:12px 14px;background:linear-gradient(90deg,rgba(255,196,40,.16),rgba(255,196,40,0))}
.presented .label{color:#ffd45a}
.premio{font-size:13px;color:#ffd45a}
.bnr{margin:0;display:flex;flex-direction:column;gap:4px}
.bnr .tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);align-self:flex-end}
.bnr img,.bgen{width:100%;max-width:100%;aspect-ratio:4/1;border-radius:10px;display:block;object-fit:cover;border:1px solid var(--line)}
.bgen{position:relative;overflow:hidden;display:flex;align-items:center;gap:clamp(10px,3vw,22px);padding:0 clamp(14px,4vw,28px);
  background:linear-gradient(110deg,var(--bc) 0%,var(--bc) 38%,#0b0d0e 38.2%,#0b0d0e 100%);color:#fff}
.bgen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 18px,rgba(255,255,255,.05) 18px 20px);pointer-events:none}
.bgen svg{width:clamp(48px,14vw,84px);height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));position:relative;z-index:1}
.bgen .bt{position:relative;z-index:1;min-width:0;margin-left:auto;text-align:right}
.bgen .bn{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(18px,5.4vw,32px);line-height:1;text-wrap:balance}
.bgen .bl{font-size:clamp(11px,3vw,15px);color:var(--bc);font-weight:600;margin-top:4px}
.bgen .bg{font-size:clamp(9px,2.4vw,12px);color:#b9c0b8;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.hero{position:relative;border-radius:14px;padding:3px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-50%;z-index:-2;background:conic-gradient(from 0deg,#7a5a00,#ffd45a,#fff3c2,#ffb800,#7a5a00,#ffd45a,#7a5a00)}
@media (prefers-reduced-motion:no-preference){.hero::before{animation:spin 6s linear infinite}.hero .shine{animation:shine 4.5s ease-in-out infinite}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes shine{0%,55%{transform:translateX(-120%) skewX(-18deg)}85%,100%{transform:translateX(320%) skewX(-18deg)}}
.hero .in{position:relative;border-radius:11px;overflow:hidden;min-height:clamp(140px,32vw,260px);padding-block:14px;background:radial-gradient(120% 140% at 0% 0%,rgba(255,200,60,.35),transparent 55%),linear-gradient(120deg,#151006,#050505 60%);display:flex;align-items:center;gap:clamp(12px,4vw,30px);padding:0 clamp(14px,4.5vw,34px)}
.hero .in.im{min-height:0;aspect-ratio:3/1;padding:0}
.hero .in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .k{overflow-wrap:anywhere}
.hero .shine{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,240,190,.28),transparent);pointer-events:none;z-index:2}
.hero .lg svg{width:clamp(64px,19vw,120px);height:auto;filter:drop-shadow(0 0 16px rgba(255,200,60,.55))}
.hero .tx{min-width:0;position:relative;z-index:1}
.hero .k{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(10px,2.6vw,13px);color:#ffd45a}
.hero .n{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.95;font-size:clamp(24px,7.6vw,46px);color:#fff;text-shadow:0 2px 16px rgba(255,200,60,.35);text-wrap:balance}
.hero .l{font-size:clamp(11px,3vw,15px);color:#f5e4b0;margin-top:6px;font-weight:600}
.hero .p{display:inline-block;margin-top:8px;font-size:clamp(10px,2.6vw,13px);font-weight:700;color:#1a1200;background:linear-gradient(90deg,#ffd45a,#ffb800);border-radius:999px;padding:3px 10px}
body.welcome nav.tabs,body.welcome #who{display:none}
.wel{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.wel .big{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(40px,12vw,64px);line-height:.9;color:var(--ball);text-shadow:var(--glow);margin:0}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--ball);box-shadow:var(--glow)}
.opt .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ball);font-family:var(--f-display);font-weight:800;font-size:22px}
.opt.main{border-color:var(--ball)}.opt.main .ic{background:var(--ball);color:var(--ball-ink)}
.opt b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.opt .ar{color:var(--ball);font-size:22px}
.tier.banner{border-color:#ff7ad9;color:#ff7ad9}
.sp-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sp-row:first-child{border-top:0}
.tier{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tier.oficial{border-color:#ffd45a;color:#ffd45a}.tier.cancha{border-color:var(--ball);color:var(--ball)}
body.busy header.top::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:35%;background:#fff;box-shadow:0 0 10px #fff;animation:busy 1s ease-in-out infinite}
@keyframes busy{0%{left:-35%}100%{left:100%}}
.rk tr.yo td.nm{outline:1px solid var(--ball);outline-offset:-1px}
.me-btn:hover{background:rgba(212,255,31,.12)}

nav.tabs button.on{color:var(--ball);border-top-color:var(--ball);text-shadow:var(--glow)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:var(--glow)}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,background .15s}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
.install{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--ball);border-radius:12px;padding:12px 14px;background:rgba(212,255,31,.06)}
</style>

<script>

const esHist=r=>r&&r.tipo==="historica";
function retaState(rid,r){
  if(esHist(r))return{label:"Histórica",cls:"done",n:0,done:0};

/* ---------- sorteos ---------- */
function sortearRoyal(ids,canchas,rondas){
  const courts=Math.min(canchas,Math.floor(ids.length/4));const played={},partner={},opp={};ids.forEach(i=>played[i]=0);
  const k=(a,b)=>a<b?a+"|"+b:b+"|"+a;const out=[];
  for(let r=1;r<=rondas;r++){
    const pool=shuffle(ids.slice()).sort((a,b)=>played[a]-played[b]);
    const playing=pool.slice(0,courts*4);let best=playing,bs=Infinity;
    for(let t=0;t<400;t++){const p=shuffle(playing.slice());let sc=0;
      for(let c=0;c<courts;c++){const[a,b,x,y]=p.slice(c*4,c*4+4);sc+=((partner[k(a,b)]||0)+(partner[k(x,y)]||0))*10;for(const i of[a,b])for(const j of[x,y])sc+=opp[k(i,j)]||0}
      if(sc<bs){bs=sc;best=p;if(!sc)break}}
    for(let c=0;c<courts;c++){const[a,b,x,y]=best.slice(c*4,c*4+4);
      out.push({id:"r"+r+"c"+(c+1),ronda:r,cancha:c+1,a:[a,b],b:[x,y]});
      [a,b,x,y].forEach(i=>played[i]++);partner[k(a,b)]=(partner[k(a,b)]||0)+1;partner[k(x,y)]=(partner[k(x,y)]||0)+1;
      for(const i of[a,b])for(const j of[x,y])opp[k(i,j)]=(opp[k(i,j)]||0)+1}
  }return out;
}
function sortearFija(pairs,canchas){
  let P=pairs.map((_,i)=>i);if(P.length%2)P.push(-1);const m=P.length;const rounds=[];
  for(let r=0;r<m-1;r++){const ms=[];for(let i=0;i<m/2;i++){const x=P[i],y=P[m-1-i];if(x>=0&&y>=0)ms.push([x,y])}rounds.push(shuffle(ms));P=[P[0],P[m-1],...P.slice(1,m-1)]}
  const out=[];let ronda=0;
  rounds.forEach(ms=>{for(let i=0;i<ms.length;i+=canchas){ronda++;ms.slice(i,i+canchas).forEach((mm,j)=>out.push({id:"r"+ronda+"c"+(j+1),ronda,cancha:j+1,a:pairs[mm[0]],b:pairs[mm[1]]}))}});
  return out;
}
const pairsOf=ids=>{const o=[];for(let i=0;i+1<ids.length;i+=2)o.push([ids[i],ids[i+1]]);return o};

/* ---------- estadísticas ---------- */
function computeStats(){
  const st={};const g=id=>st[id]??={elo:1000,pj:0,pg:0,pe:0,pp:0,pf:0,pc:0,last:[],sets:0,retas:0};
  for(const[rid,r] of Object.entries(S.retas).sort((a,b)=>-retaOrder(a,b))){
    if(esHist(r)){for(const f of r.partidos||[]){if(!f||!f.jugadorId)continue;const p=g(f.jugadorId);p.sets+=Number(f.total)||0;p.retas++}continue}
    const enReta=new Set();
    for(const m of(r.partidos||[]).slice().sort((x,y)=>x.ronda-y.ronda||x.cancha-y.cancha)){
      const s=S.scores[scoreKey(rid,m.id)];if(!s||s.a==null||s.b==null)continue;
      const A=m.a.map(g),B=m.b.map(g);const ra=A.reduce((t,p)=>t+p.elo,0)/A.length,rb=B.reduce((t,p)=>t+p.elo,0)/B.length;
      const ea=1/(1+Math.pow(10,(rb-ra)/400));const sa=s.a>s.b?1:s.a<s.b?0:.5;const d=24*(sa-ea);
      m.a.concat(m.b).forEach(x=>enReta.add(x));
      A.forEach(p=>{p.sets+=s.a;p.elo+=d;p.pj++;p.pf+=s.a;p.pc+=s.b;sa===1?p.pg++:sa===0?p.pp++:p.pe++;p.last.push(sa)});
      B.forEach(p=>{p.sets+=s.b;p.elo-=d;p.pj++;p.pf+=s.b;p.pc+=s.a;sa===0?p.pg++:sa===1?p.pp++:p.pe++;p.last.push(1-sa)});
    }
    enReta.forEach(x=>g(x).retas++);
  }return st;
}
function retaTable(rid,r){
  const fija=r.tipo==="fija";const rows={};
  const key=t=>fija?t.slice().sort().join("+"):null;
  const ensure=(k,ids)=>rows[k]??={ids,pj:0,pg:0,pf:0,pc:0};
  if(fija)pairsOf(r.jugadores||[]).forEach(p=>ensure(key(p),p));else(r.jugadores||[]).forEach(id=>ensure(id,[id]));
  for(const m of r.partidos||[]){const s=S.scores[scoreKey(rid,m.id)];if(!s||s.a==null||s.b==null)continue;
    const sides=[[m.a,s.a,s.b],[m.b,s.b,s.a]];
    for(const[team,f,c] of sides){const ks=fija?[key(team)]:team;ks.forEach(k=>{const r0=ensure(k,fija?team:[k]);r0.pj++;r0.pf+=f;r0.pc+=c;if(f>c)r0.pg++})}}
  return Object.values(rows).sort((a,b)=>b.pg-a.pg||(b.pf-b.pc)-(a.pf-a.pc)||b.pf-a.pf);
}

function vRanking(){
  const st=computeStats();const modo=S.rkModo||"sets";const val=x=>modo==="sets"?x.sets:x.elo;
  Object.keys(S.players).forEach(id=>{st[id]??={elo:1000,pj:0,pg:0,pe:0,pp:0,pf:0,pc:0,last:[],sets:0,retas:0}});
  const rows=Object.entries(st).filter(([id])=>S.players[id]).sort((a,b)=>val(b[1])-val(a[1])||b[1].elo-a[1].elo||pname(a[0]).localeCompare(pname(b[0])));
  const lo=rows.length?Math.min(...rows.map(r=>val(r[1]))):0,hi=rows.length?Math.max(...rows.map(r=>val(r[1]))):0;
  const trend=l=>l.slice(-5).map(x=>x===1?"G":x===0?"P":"E").join(" ");
  const of=oficial();let pos=0,prev=null;
  return`<div class="stack"><div class="section-head"><h1>Ranking</h1><span class="muted small">${rows.length} jugadores</span></div>${of?heroHTML(of):""}
  <div class="seg" role="tablist"><label><input type="radio" name="rk" data-act="rkModo" value="sets" ${modo==="sets"?"checked":""}>Puntos</label><label><input type="radio" name="rk" data-act="rkModo" value="rating" ${modo==="rating"?"checked":""}>Rating</label></div>
  <p class="muted" style="margin:0">${modo==="sets"?"<b>Puntos</b> suma los puntos ganados en todas las retas: las históricas cargadas de las fotos y cada partido capturado en la app.":"Todos empiezan en 1000. Cada partido compara el promedio de las dos parejas: ganarle a una pareja más fuerte da más puntos y perder con una más débil quita más. <b>Dif</b> = puntos anotados menos puntos recibidos."}</p>
  ${rows.length?`<div class="panel tbl-wrap rk"><table><thead><tr><th>#</th><th>Jugador</th>${modo==="sets"?"<th>Puntos</th><th>Retas</th><th>Rating</th>":"<th>Rating</th><th>PJ</th><th>PG</th><th>%</th><th>Dif</th><th>Últimos</th><th>Puntos</th>"}</tr></thead><tbody>
  ${rows.map(([id,x],i)=>{const v=val(x);if(v!==prev){pos=i+1;prev=v}const g=hi>lo?(v-lo)/(hi-lo):1;
    const celdas=modo==="sets"?`<td class="elo">${x.sets}</td><td>${x.retas}</td><td>${Math.round(x.elo)}</td>`
      :`<td class="elo">${Math.round(x.elo)}</td><td>${x.pj}</td><td>${x.pg}</td><td>${x.pj?Math.round(x.pg/x.pj*100):0}</td><td class="${x.pf-x.pc>0?"up":x.pf-x.pc<0?"down":""}">${x.pf-x.pc>0?"+":""}${x.pf-x.pc}</td><td class="muted small">${trend(x.last)}</td><td>${x.sets}</td>`;
    return`<tr class="${pos<=3?"top":""}${id===S.uid?" yo":""}" style="--g:${g.toFixed(3)}"><td class="pos ${pos<=3?"m"+pos:""}">${pos}</td><td class="nm"><b>${esc(pname(id))}</b><div class="muted small">${esc(pfull(id))}</div></td>${celdas}</tr>`}).join("")}
  </tbody></table></div>`:`<div class="panel empty"><strong>Aún sin partidos</strong>El ranking se arma solo en cuanto se capturen marcadores en las retas.</div>`}</div>`;
}

/* ---------- conexión con el servidor ---------- */
function getTok(){try{return localStorage.getItem("lareta_token")||""}catch(e){return S._tok||""}}
function setTok(t){S._tok=t;try{t?localStorage.setItem("lareta_token",t):localStorage.removeItem("lareta_token")}catch(e){}}
let busyN=0;function busy(d){busyN=Math.max(0,busyN+d);document.body.classList.toggle("busy",busyN>0)}
function call(accion,datos){
  return new Promise((res,rej)=>{
    busy(1);
    if(!(window.google&&google.script&&google.script.run)){
      fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:getTok(),accion,datos:datos||{}})})
        .then(x=>x.json()).then(r=>{busy(-1);
          if(r&&r.ok)return res(r.data);
          if(r&&r.sesion===false){setTok("");S.uid=null;S.yo=null;S.isOwner=false;S.canWrite=false;go("inicio");refresh(true)}
          rej(new Error((r&&r.error)||"No se pudo completar."))})
        .catch(()=>{busy(-1);rej(new Error("Sin conexión. Revisa tu internet e intenta de nuevo."))});
      return;
    }
    google.script.run.withSuccessHandler(r=>{busy(-1);
      if(r&&r.ok)return res(r.data);
      if(r&&r.sesion===false){setTok("");S.uid=null;S.yo=null;S.isOwner=false;S.canWrite=false;go("inicio");refresh(true)}
      rej(new Error((r&&r.error)||"No se pudo completar."))
    }).withFailureHandler(e=>{busy(-1);rej(new Error("Sin conexión. Revisa tu internet e intenta de nuevo."))}).api(getTok(),accion,datos||{});
  });
}
function apply(d){
  if(!d||d.igual)return false;
  S.version=d.version;S.yo=d.yo||null;S.uid=S.yo?S.yo.id:null;S.isOwner=!!d.admin;S.canWrite=!!S.uid;
  S.players=Object.fromEntries((d.jugadores||[]).map(j=>[j.id,j]));
  S.clubs=Object.fromEntries((d.clubs||[]).map(c=>[c.id,c]));
  S.retas=Object.fromEntries((d.retas||[]).map(r=>[r.id,r]));
  S.scores=Object.fromEntries((d.marcadores||[]).map(m=>[m.id,m]));
  S.multas=Object.fromEntries((d.multas||[]).map(m=>[m.id,m]));
  S.sponsors=Object.fromEntries((d.patrocinadores||[]).map(p=>[p.id,p]));
  const av=d.avisos||[];
  if(S.uid&&S.avisosVistos){av.filter(a=>!a.leido&&!S.avisosVistos.has(a.id)).slice(0,3).forEach(notificar)}
  S.avisos=av;S.avisosVistos=new Set(av.map(a=>a.id));
  S.loadedPlayers=true;S.status="ready";
  renderSpons();return true;
}
async function refresh(force){
  try{const d=await call(getTok()?"todo":"publico",{version:force?"":S.version});if(apply(d)){S.keepScroll=true;render()}}
  catch(e){if(S.status==="loading"){S.status="error";S.err=e.message;render()}}
}
async function act(accion,datos,msg){
  try{const r=await call(accion,datos);await refresh(true);if(msg)flash(msg);return r}
  catch(e){flash(e.message);refresh(true);return null}
}

/* ---------- acciones ---------- */
function readDraft(form){const d=S.draft;const f=new FormData(form);
  d.clubTexto=f.get("clubTexto")||"";
  d.fecha=f.get("fecha");d.hora=f.get("hora");d.canchas=Math.max(1,+f.get("canchas")||1);d.maxJugadores=Math.max(4,+f.get("maxJugadores")||4);
  d.tipo=f.get("tipo");d.modo=f.get("modo");d.puntos=Math.max(1,+f.get("puntos")||1);d.castigo=f.get("castigo");d.extra=f.get("extra");
  const presets=f.getAll("preset").map(i=>PRESET_RULES[+i]);d.reglas=[...presets,...d.reglas.filter(r=>!PRESET_RULES.includes(r))];}
function setIns(r,lista,msg){S.retas[r.id]={...r,jugadores:lista};S.keepScroll=true;render();return act("inscritos",{retaId:r.id,jugadores:lista},msg)}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t||t.tagName==="INPUT")return;const a=t.dataset.act;
  if(a==="tab"){const v=t.dataset.v;if(v==="cuentas"){S.cuentas=null;call("jugadoresAdmin").then(l=>{S.cuentas=l;S.keepScroll=true;render()}).catch(er=>flash(er.message))}
    if((v==="perfil"||v==="club")&&!S.uid&&v!=="club")return go("inicio");return go(v)}
  if(a==="skip"){S.welcomed=true;return go("retas")}
  if(a==="noop")return;
  if(a==="pushNo"){S.pushNo=true;try{localStorage.setItem("lareta_pushNo",String(Date.now()))}catch(er){}S.keepScroll=true;return render()}
  if(a==="permiso"){const okp=await activarPush(true);
    if(okp){flash("Notificaciones activadas");navigator.serviceWorker.ready.then(g=>g.showNotification("La Reta",{body:"Así te avisaremos cuando alguien se apunte a tus retas.",icon:"icons/icon-192.png",badge:"icons/badge-96.png",vibrate:[200,100,200],tag:"prueba"}))}
    else if(permisoNotif()==="denied")flash("Bloqueaste las notificaciones. Actívalas en los ajustes del navegador.");
    else flash("No se pudieron activar en este celular.");
    S.keepScroll=true;return render()}
  if(a==="regclub"){S.afterReg="club";return go(S.uid?"club":"registro")}
  if(a==="nueva"){if(!S.uid)return go("inicio");return go("nueva",{draft:newDraft()})}
  if(a==="open")return go("reta",{retaId:t.dataset.id});
  if(a==="addrule"){const f=t.closest("form");readDraft(f);const x=(S.draft.extra||"").trim();if(x&&!S.draft.reglas.includes(x))S.draft.reglas.push(x);S.draft.extra="";S.keepScroll=true;document.activeElement.blur();return render()}
  if(a==="delrule"){readDraft(t.closest("form"));S.draft.reglas=S.draft.reglas.filter(r=>r!==t.dataset.i);S.keepScroll=true;return render()}
  if(a==="noimg"){S.sponImg="";S.keepScroll=true;return render()}
  if(a==="editS"){S.sponImg=undefined;S.editSpon=t.dataset.id||null;S.confirm=null;render();window.scrollTo(0,0);return}
  if(a==="delSpon"){const id=S.editSpon;S.editSpon=null;S.confirm=null;render();return act("borrarPatrocinador",{id},"Patrocinador borrado")}
  if(a==="ask"){S.confirm=t.dataset.what;S.keepScroll=true;return render()}
  if(a==="cancel"){S.confirm=null;S.keepScroll=true;return render()}
  if(a==="toggleIns"){S.showInscribir=!S.showInscribir;S.keepScroll=true;return render()}
  if(a==="pinToggle"){S.showPin=!S.showPin;S.keepScroll=true;return render()}
  if(a==="pinOk"){S.pinNuevo=null;return render()}
  if(a==="logout"){try{await call("salir")}catch(er){}setTok("");S.uid=null;S.yo=null;S.isOwner=false;S.canWrite=false;S.welcomed=false;S.version="";go("inicio");return refresh(true)}
  if(a==="resetPin"){const id=t.dataset.id;const r=await act("resetPin",{jugadorId:id});if(r){S.pinNuevo={id,pin:r.pin};S.cuentas=await call("jugadoresAdmin").catch(()=>S.cuentas);render();window.scrollTo(0,0)}return}
  if(a==="bloquear"){await act("estadoJugador",{jugadorId:t.dataset.id,estado:t.dataset.e},t.dataset.e==="bloqueado"?"Cuenta bloqueada":"Cuenta activa");S.cuentas=await call("jugadoresAdmin").catch(()=>S.cuentas);return render()}
  const rid=S.retaId,r=S.retas[rid];if(!r||!S.uid)return;
  if(a==="join"||a==="leave"){let ins=(r.jugadores||[]).filter(x=>x!==S.uid);if(a==="join"){if(ins.length>=r.maxJugadores)return flash("La reta ya está llena.");ins.push(S.uid)}
    return setIns(r,ins,a==="join"?"Quedaste apuntado":"Te saliste de la reta")}
  if(a==="swap"){const ins=r.jugadores.slice();const i=+t.dataset.i;const full=ins.length-(ins.length%2);const k=(i+2)%full;[ins[i],ins[k]]=[ins[k],ins[i]];return setIns(r,ins)}
  if(a==="mixPairs")return setIns(r,shuffle(r.jugadores.slice()));
  if(a==="sortear"){const ins=r.jugadores||[];let ps;
    if(r.tipo==="fija")ps=sortearFija(pairsOf(ins),r.canchas);else ps=sortearRoyal(ins,r.canchas,Math.max(1,+document.getElementById("rondas")?.value||4));
    S.keepScroll=true;return act("partidos",{retaId:rid,partidos:ps},"Partidos sorteados")}
  if(a==="resortear"){S.keepScroll=true;return act("partidos",{retaId:rid,partidos:[]})}
  if(a==="multa"){const pid=t.dataset.id;const k=scoreKey(rid,pid);const cambio=+t.dataset.d;const n=Math.max(0,((S.multas[k]||{}).n||0)+cambio);S.multas[k]={id:k,retaId:rid,jugadorId:pid,n};S.keepScroll=true;render();
    return call("multa",{retaId:rid,jugadorId:pid,cambio}).catch(er=>{flash(er.message);refresh(true)})}
  if(a==="delReta"){go("retas");return act("borrarReta",{retaId:rid},"Reta borrada")}
});

      call("subirImagen",{tipo:f.type,base64:b64}).then(r=>{S.sponImg=r.imagenId;S.keepScroll=true;document.activeElement?.blur();render();flash("Imagen lista. Guarda para aplicarla.")}).catch(er=>flash(er.message))};
    rd.readAsDataURL(f);return}
  const sf=t.closest("form[data-form='spon']");if(sf){const svg=sf.querySelector("svg");if(svg){const fd=new FormData(sf);svg.outerHTML=logoSVG({nombre:fd.get("nombre"),siglas:fd.get("siglas"),forma:fd.get("forma"),color:fd.get("color"),tinta:fd.get("tinta")},56)}return}
  if(t.dataset.act==="rkModo"){S.rkModo=t.value;try{localStorage.setItem("lareta_rk",t.value)}catch(er){}S.keepScroll=true;t.blur();return render()}
  const a=t.dataset.act;const rid=S.retaId,r=S.retas[rid];if(!r||!S.uid)return;
  if(a==="ins"){let ins=(r.jugadores||[]).slice();const id=t.dataset.id;
    if(t.checked){if(ins.length>=r.maxJugadores){t.checked=false;return flash("La reta ya está llena.")}if(!ins.includes(id))ins.push(id)}else ins=ins.filter(x=>x!==id);
    setIns(r,ins);return}
  if(a==="score"){const mid=t.dataset.m;const k=scoreKey(rid,mid);const cur={...(S.scores[k]||{id:k,retaId:rid,matchId:mid,a:null,b:null})};
    const v=t.value===""?null:Math.max(0,Math.min(99,Math.round(+t.value)));cur[t.dataset.side]=v;
    S.scores[k]=cur;S.keepScroll=true;S.dirty=true;
    setTimeout(()=>{const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest("#main")&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()},60);
    call("marcador",{retaId:rid,matchId:mid,a:cur.a,b:cur.b}).catch(er=>{flash(er.message);refresh(true)})}
});
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.dirty&&!document.activeElement?.closest?.("#main input,#main select,#main textarea")){S.keepScroll=true;render()}},0));

document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const kind=f.dataset.form;const fd=new FormData(f);const g=k=>String(fd.get(k)||"").trim();
  document.activeElement?.blur();
  if(kind==="login"){const cel=g("celular").replace(/\D/g,""),pin=g("pin");
    if(cel.length!==10)return flash("Escribe tu celular a 10 dígitos.");if(!/^\d{6}$/.test(pin))return flash("El PIN es de 6 números.");
    try{const r=await call("entrar",{celular:cel,pin});setTok(r.token);S.welcomed=true;S.version="";await refresh(true);go("retas");activarPush(false);flash("Hola, "+(r.yo.alias||r.yo.nombre))}catch(er){flash(er.message)}return}
  if(kind==="registro"){const cel=g("celular").replace(/\D/g,""),pin=g("pin");
    if(!g("nombre"))return flash("Escribe tu nombre.");if(cel.length!==10)return flash("Escribe tu celular a 10 dígitos.");
    if(!/^\d{6}$/.test(pin))return flash("El PIN debe ser de 6 números.");if(pin!==g("pin2"))return flash("Los dos PIN no coinciden.");
    try{const r=await call("registro",{nombre:g("nombre"),apellido:g("apellido"),alias:g("alias"),celular:cel,pin});setTok(r.token);S.welcomed=true;S.version="";await refresh(true);
      const next=S.afterReg==="club"?"club":"retas";S.afterReg=null;go(next);flash(r.yo.rol==="ADMIN"?"Cuenta creada. Eres el administrador.":"¡Listo! Ya estás registrado.")}catch(er){flash(er.message)}return}
  if(kind==="perfil"){if(!g("nombre"))return flash("Escribe tu nombre.");return act("perfil",{nombre:g("nombre"),apellido:g("apellido"),alias:g("alias")},"Perfil guardado")}
  if(kind==="pin"){if(!/^\d{6}$/.test(g("nuevo")))return flash("El PIN nuevo debe ser de 6 números.");if(g("nuevo")!==g("nuevo2"))return flash("Los PIN nuevos no coinciden.");
    const r=await act("cambiarPin",{actual:g("actual"),nuevo:g("nuevo")});if(r){S.showPin=false;render();flash("PIN cambiado")}return}
  if(kind==="club"){if(!g("nombre"))return flash("Escribe el nombre del club.");
    return act("club",{nombre:g("nombre"),ciudad:g("ciudad"),direccion:g("direccion"),canchas:+fd.get("canchas")||null,telefono:g("telefono"),horario:g("horario")},"Club guardado")}
  if(kind==="spon"){const data={id:S.editSpon==="new"?"":S.editSpon,nombre:g("nombre"),giro:g("giro"),paquete:g("paquete"),cancha:+fd.get("cancha")||null,cuota:+fd.get("cuota")||0,
      forma:g("forma"),color:g("color"),tinta:g("tinta"),siglas:g("siglas").toUpperCase(),contacto:g("contacto"),premio:g("premio"),lema:g("lema"),activo:fd.get("activo")==="on"};
    const prev=S.editSpon!=="new"?(S.sponsors[S.editSpon]||{}).imagenId:"";data.imagenId=S.sponImg!==undefined?S.sponImg:(prev||"");
    if(!data.nombre)return flash("Escribe el nombre de la marca.");
    const r=await act("patrocinador",data,"Patrocinador guardado");if(r){S.editSpon=null;S.sponImg=undefined;render()}return}
  if(kind==="reta"){readDraft(f);const d=S.draft;if(!d.clubTexto.trim())return flash("Escribe el club.");
    const r=await act("crearReta",{club:d.clubTexto.trim(),fecha:d.fecha,hora:d.hora,canchas:d.canchas,maxJugadores:d.maxJugadores,tipo:d.tipo,puntos:d.puntos,modo:d.modo,reglas:d.reglas,castigo:d.castigo},"Reta creada. Apúntate e invita a los demás.");
    if(r){S.draft=null;go("reta",{retaId:r.id})}}
});

/* ---------- instalar como app ---------- */
let instalarEvt=null;
const esStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instalarEvt=e;S.keepScroll=true;render()});
window.addEventListener("appinstalled",()=>{instalarEvt=null;flash("La Reta quedó instalada");render()});
function instalarHTML(){
  if(esStandalone())return"";
  if(instalarEvt)return`<div class="install"><div><b>Instala La Reta</b><div class="muted small">Queda en tu celular como cualquier app.</div></div><button class="btn primary sm" data-act="instalar">Instalar</button></div>`;
  if(esIOS())return`<div class="install"><div><b>Instala La Reta en tu iPhone</b><div class="muted small">Toca Compartir y luego "Agregar a pantalla de inicio".</div></div></div>`;
  return"";
}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act=instalar]");if(!t||!instalarEvt)return;instalarEvt.prompt();await instalarEvt.userChoice.catch(()=>{});instalarEvt=null;render()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- arranque ---------- */
(async()=>{
  S.version="";
  await refresh(true);
  if(S.status!=="ready")return;
  S.view=S.uid?"retas":"inicio";
  try{const t=+localStorage.getItem("lareta_pushNo");if(t&&Date.now()-t<7*864e5)S.pushNo=true}catch(e){}
  render();
  if(S.uid&&permisoNotif()==="granted")activarPush(false).then(o=>{if(o){S.keepScroll=true;render()}});
  if(location.hash==="#avisos"&&S.uid){S.view="avisos";render()}
  if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.retaId&&S.retas[e.data.retaId])go("reta",{retaId:e.data.retaId});else if(S.uid)go("avisos")});
  setInterval(()=>{if(S.dirty)return;if(document.hidden&&Date.now()-(S.ultimoBg||0)<60000)return;if(document.hidden)S.ultimoBg=Date.now();const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;refresh(false)},20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh(false)});
})();
</script>
</body></html>
